name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
          # Do not set registry-url or NODE_AUTH_TOKEN. The npm CLI detects
          # GitHub's OIDC environment and exchanges its short-lived ID token
          # through the Trusted Publisher configured on npmjs.com.

      - name: Install npm with OIDC support
        # Trusted Publishing requires npm >= 11.5.1. Pin the same known-good
        # release used by the other ZnVault plugins for reproducible releases.
        run: npm install -g npm@11.10.1

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"

      - name: Check package
        run: npm run check

      - name: Publish to npm with Trusted Publishing
        run: npm publish --access public --provenance --loglevel=verbose

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
